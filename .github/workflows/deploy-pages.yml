# ============================================================
# Build the site and deploy it to GitHub Pages.
#
# This workflow builds the site and deploys it to Pages.
#
# It only takes effect once someone with admin rights sets
# Settings → Pages → Build and deployment → Source to "GitHub
# Actions". The Actions token cannot make that change itself: the
# API answers 403 "Resource not accessible by integration". Until
# it is changed, Pages also runs its own Jekyll build of this
# branch, and the two race — so the built site is committed at the
# repository root as well, with a .nojekyll file, and both routes
# serve the same thing. `npm run publish:pages` refreshes that copy.
#
# Once the source is switched: the Jekyll build stops firing, this
# workflow becomes the only deployer, and the root copy can be
# deleted (the files listed in .pages-published.json).
#
# `configure-pages` tells us the URL the site will be served from,
# and the build uses it: on a project site that means every
# root-relative link gets the /<repo> prefix.
#
# The deployment is a prototype for review — PROTOTYPE=1 makes
# every page noindex and robots.txt disallow everything. Drop it
# when this becomes the published site.
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/site-health-check-df5ie0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The build itself needs no dependencies — only Node's own
      # modules. sharp and Playwright are for `npm run images` and
      # `npm run check`, which do not run here.

      # Tries to switch the source; the Actions token is normally refused, so
      # this is a no-op that reports what a person has to do instead.
      - name: Try to make Pages build from this workflow
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow \
            && echo "Pages source: GitHub Actions" \
            || echo "::warning::Could not set the Pages source. If a Jekyll 'pages build and deployment' run appears alongside this one, set Settings → Pages → Source to GitHub Actions by hand."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: node build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PROTOTYPE: '1'

      - name: Check the build looks right
        run: |
          test -f dist/index.html
          test -f dist/assets/css/site.css
          test "$(find dist -name index.html | wc -l)" -ge 12
          echo "Built for ${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
