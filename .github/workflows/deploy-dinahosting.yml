# ============================================================
# Build the site and publish it to erasmusinbarcelona.com.
#
# The runner builds dist/ exactly as `npm run build` does, adds the
# production .htaccess generated from src/data/redirects.js, and
# mirrors the result into the hosting account's web root over FTPS.
#
# The transfer is FTPS driven by lftp, after the first attempt
# timed out on the control socket. A probe from a runner found
# port 21 open and AUTH TLS completing in about a second, so the
# server was never the problem: it presents a valid certificate
# issued for *.espacioseguro.com, which does not match the host
# being dialled, and a client that verifies the hostname waits
# there until it gives up.
#
# So the chain is still verified — ssl:verify-certificate stays
# on — and only the hostname check is dropped, which is the one
# thing that cannot succeed against a shared-hosting certificate.
#
# The mirror deletes files on the server that are no longer in
# dist/, so the live site is always exactly what this repository
# builds. Anything the server keeps for itself is named in the
# exclude list on the upload step.
#
# Credentials live in repository secrets and never appear here.
# SSH and FTP share them on this host, so the FTP_* names still
# fit:
#   FTP_SERVER    the hosting account's host
#   FTP_USERNAME  the account user
#   FTP_PASSWORD  its password
#
# The user lands in the account home, not the web root, so the
# target is /www/ — the directory Apache serves. Mirroring into
# the home itself would delete Maildir, logs and the rest of the
# account, so the path is checked before anything uploads.
# Repository variable DEPLOY_DIR overrides it; SITE_CHECK_URL
# points the post-deploy check somewhere else (the hosting's own
# *.dinaserver.com name, while the domain still answers
# elsewhere).
# ============================================================
name: Deploy to dinahosting

on:
  push:
    branches:
      - main
      - claude/site-health-check-df5ie0
  workflow_dispatch:

# One deployment at a time, and let a running one finish rather
# than leaving the web root half-written.
concurrency:
  group: dinahosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.erasmusinbarcelona.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The build needs no dependencies — only Node's own modules.
      # sharp and Playwright are for `npm run images` and `npm run
      # check`, neither of which runs here.
      - name: Build
        run: |
          node build.mjs
          node tools/build-htaccess.mjs

      # The upload deletes whatever is not in dist/, so the one
      # thing that must never be wrong is where it points.
      - name: Refuse to mirror outside the web root
        run: |
          dir='${{ vars.DEPLOY_DIR || '/www/' }}'
          case "$dir" in
            /www/|/www/*) ;;
            *) echo "::error::DEPLOY_DIR is '$dir'. The deploy deletes whatever is not in dist/, so it may only target the web root."; exit 1 ;;
          esac
          echo "web root: $dir"

      # PROTOTYPE=1 builds the Pages preview: every page noindex, a
      # robots.txt that disallows everything, and a redirecting stub at
      # each legacy path. Publishing one would take the site out of the
      # index, so both of its markers are checked here. 404.html is
      # noindex in every build, correctly, and is the one exception.
      - name: Refuse to publish a prototype build
        run: |
          if grep -q '^Disallow: /$' dist/robots.txt; then
            echo "::error::dist/robots.txt disallows everything — this is a prototype build."
            exit 1
          fi
          stray=$(grep -rl 'content="noindex' dist/ --include='*.html' | grep -v '^dist/404\.html$' || true)
          if [ -n "$stray" ]; then
            echo "::error::noindex on pages that are meant to be indexed:"
            echo "$stray"
            exit 1
          fi
          grep -q 'https://www.erasmusinbarcelona.com/' dist/sitemap.xml \
            || { echo "::error::sitemap.xml does not point at the live domain."; exit 1; }
          test -f dist/.htaccess || { echo "::error::dist/.htaccess is missing."; exit 1; }
          echo "publishable build: robots.txt allows indexing, only 404.html is noindex"

      - name: Publish over FTPS
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ vars.DEPLOY_DIR || '/www/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # cgi-bin belongs to the server and .well-known is where
          # Let's Encrypt writes its challenge. Neither comes from
          # dist/, so neither may be swept up by --delete.
          # --env-password keeps the password out of the process
          # list, where -u user,pass would put it.
          lftp -u "$USER" --env-password "ftp://$HOST" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname no
          set net:max-retries 3
          set net:timeout 20
          set cmd:fail-exit true
          mirror -R --delete --parallel=4 --verbose=1 --exclude-glob .git* --exclude cgi-bin/ --exclude .well-known/ dist/ $DIR
          bye
          LFTP

      # Against the real domain once it points here; against the
      # hosting's own name while it does not.
      - name: Check the site answers
        env:
          BASE: ${{ vars.SITE_CHECK_URL || 'https://www.erasmusinbarcelona.com' }}
        run: |
          sleep 10
          echo "checking $BASE"
          for path in / /join-a-course/ /dates/ /contact/ /your-week/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$BASE$path")
            echo "$code  $path"
            [ "$code" = "200" ] || exit 1
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/no-such-page/")
          echo "$code  /no-such-page/ (expected 404)"
          [ "$code" = "404" ] || exit 1
          for legacy in /about-us/:/about/ /program-information/:/your-week/ /we-come-to-you/:/plan-a-mobility/; do
            from=${legacy%%:*}; to=${legacy##*:}
            location=$(curl -sSI "$BASE$from" | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r')
            echo "$from → $location (expected $to)"
            case "$location" in *"$to") ;; *) exit 1 ;; esac
          done
