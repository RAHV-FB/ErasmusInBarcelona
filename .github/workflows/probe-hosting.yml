# ============================================================
# One-off diagnostic: can a GitHub runner reach the hosting at all?
#
# The first FTPS deploy died with "Timeout (control socket)" — the
# runner waited ~30s and got nothing back. A closed port answers
# immediately with a refusal, so a timeout points at packets being
# dropped rather than a service being off, which usually means the
# host is filtering the source address.
#
# This probes the ports without ever sending a credential: nc for
# reachability, and openssl's own STARTTLS for FTPS, which
# negotiates AUTH TLS before any login. It also prints the runner's
# public address, which is what dinahosting support would need in
# order to allow it.
#
# Delete this file once the deploy works.
# ============================================================
name: Probe hosting reachability

on:
  push:
    branches:
      - main
      - claude/site-health-check-df5ie0
    paths:
      - .github/workflows/probe-hosting.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Where this runner is coming from
        run: |
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Which ports answer
        run: |
          host=82.98.164.84
          for port in 21 22 990 2222; do
            if nc -z -w 8 "$host" "$port" 2>/dev/null; then
              echo "OPEN     $host:$port"
            else
              echo "no answer $host:$port"
            fi
          done
          echo "---"
          echo "A refusal is instant; a hang for the full 8s is a dropped packet."

      - name: FTP greeting, if any
        run: |
          # No credentials involved — just whether the server says hello.
          timeout 20 bash -c 'exec 3<>/dev/tcp/82.98.164.84/21 && head -c 200 <&3' \
            && echo "" || echo "(no greeting within 20s)"

      - name: Does FTPS negotiate
        run: |
          timeout 25 openssl s_client -starttls ftp -connect 82.98.164.84:21 -brief </dev/null 2>&1 \
            | head -20 || echo "(AUTH TLS did not complete)"

      - name: SSH banner, if SSH is on
        run: |
          timeout 15 bash -c 'exec 3<>/dev/tcp/82.98.164.84/22 && head -c 100 <&3' \
            && echo "" || echo "(nothing on 22 — SSH is off in the panel, or filtered)"
