<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./assets/vendor/react.production.min.js"></script>
<script src="./assets/vendor/react-dom.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="#main" style="position: absolute; left: -9999px; top: 0; z-index: 100; background: #202124; color: #FAFAF7; padding: 14px 20px; font: 600 14px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none;" style-focus="left: 0;">Skip to content</a>
<header style="position: sticky; top: 0; z-index: 50; background: #FAFAF7; border-bottom: 1px solid #202124;">
  <div style="border-bottom: 1px solid #D8D9D6;">
    <div style="max-width: 1360px; margin: 0 auto; padding: 7px clamp(16px, 4vw, 40px); display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <p style="margin: 0; font: 700 11px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.14em; color: #202124;">ERASMUS IN BARCELONA</p>
      <a href="https://spainbcn.com" style="font: 600 10.5px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.14em; color: #202124; text-decoration: none; white-space: nowrap;" style-hover="color: #3157D5;">BY SPAINBCN-PROGRAMS ↗</a>
    </div>
  </div>
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 20px;">
    <a href="./index.dc.html" aria-label="Erasmus in Barcelona — home" style="text-decoration: none; color: #202124; font: 700 24px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: -0.03em; flex-shrink: 0;">EiB<span style="color: #F26B5E;">.</span></a>
    <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); flex-wrap: wrap;">
        <sc-for list="{{ navLinks }}" as="link" hint-placeholder-count="6">
          <a href="{{ link.href }}" aria-current="{{ link.ariaCurrent }}" style="color: #202124; text-decoration: none; font: 600 12.5px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.1em; padding: 8px 0; border-bottom: 2px solid {{ link.underline }};" style-hover="border-bottom: 2px solid #3157D5;">{{ link.label }}</a>
        </sc-for>
      </nav>
      <a href="./plan-a-mobility.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 18px; background: #3157D5; color: #FAFAF7; border-radius: 2px; text-decoration: none; font: 700 12px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.1em; white-space: nowrap;" style-hover="background: #2445B0;">PLAN A MOBILITY ↗</a>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggle }}" aria-expanded="{{ open }}" aria-controls="mobile-menu" style="min-height: 44px; min-width: 44px; padding: 0 16px; background: #FAFAF7; border: 1px solid #202124; border-radius: 2px; color: #202124; font: 700 12.5px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.12em; cursor: pointer;">{{ menuLabel }}</button>
    </sc-if>
  </div>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div id="mobile-menu" style="position: fixed; inset: 0; top: 86px; z-index: 40; background: #FAFAF7; overflow-y: auto; padding: 4px 20px 32px 20px;">
    <nav aria-label="Main menu" style="display: flex; flex-direction: column; max-width: 620px; margin: 0 auto;">
      <sc-for list="{{ navLinks }}" as="link" hint-placeholder-count="6">
        <a href="{{ link.href }}" onClick="{{ close }}" style="color: #202124; text-decoration: none; font: 700 clamp(26px, 7vw, 32px)/1.1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: -0.02em; padding: 16px 0; border-bottom: 1px solid #D8D9D6; display: flex; justify-content: space-between; align-items: center;">{{ link.label }}<span aria-hidden="true" style="font-size: 20px; color: #3157D5;">→</span></a>
      </sc-for>
      <a href="./plan-a-mobility.dc.html" onClick="{{ close }}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 24px; background: #3157D5; color: #FAFAF7; border-radius: 2px; text-decoration: none; font: 700 14px/1 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.1em;">PLAN A MOBILITY ↗</a>
      <a href="https://spainbcn.com" style="margin-top: 22px; color: #202124; font: 600 11.5px/1.6 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif; letter-spacing: 0.12em; text-decoration: none;">BY SPAINBCN-PROGRAMS ↗<br><span style="color: rgba(32,33,36,.6); font-weight: 500;">COMPLETE COURSE CATALOGUE ON SPAINBCN.COM</span></a>
    </nav>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 100}, &quot;current&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;&quot;, &quot;join&quot;, &quot;group&quot;, &quot;dates&quot;, &quot;week&quot;, &quot;barcelona&quot;, &quot;about&quot;], &quot;section&quot;: &quot;Navigation&quot;}}">
class Component extends DCLogic {
  state = { open: false, isMobile: false };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 919px)');
    this.onMq = () => this.setState({ isMobile: this.mq.matches, open: this.mq.matches ? this.state.open : false });
    if (this.mq.addEventListener) this.mq.addEventListener('change', this.onMq); else this.mq.addListener(this.onMq);
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.open) this.close(); };
    document.addEventListener('keydown', this.onKey);
    this.setState({ isMobile: this.mq.matches });
  }
  componentWillUnmount() {
    if (this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMq); else this.mq.removeListener(this.onMq);
    document.removeEventListener('keydown', this.onKey);
    document.body.style.overflow = '';
  }
  close = () => { document.body.style.overflow = ''; this.setState({ open: false }); };
  renderVals() {
    const current = this.props.current ?? '';
    const navLinks = [
      { href: './join-a-course.dc.html', label: 'COURSES', id: 'join' },
      { href: './bring-a-group.dc.html', label: 'GROUPS', id: 'group' },
      { href: './dates.dc.html', label: 'DATES', id: 'dates' },
      { href: './your-week.dc.html', label: 'YOUR WEEK', id: 'week' },
      { href: './barcelona.dc.html', label: 'BARCELONA', id: 'barcelona' },
      { href: './about.dc.html', label: 'ABOUT', id: 'about' },
    ].map((l) => ({ ...l, underline: l.id === current ? '#3157D5' : 'transparent', ariaCurrent: l.id === current ? 'page' : undefined }));
    return {
      navLinks,
      isMobile: this.state.isMobile,
      notMobile: !this.state.isMobile,
      open: this.state.open,
      menuLabel: this.state.open ? 'CLOSE' : 'MENU',
      toggle: () => { const open = !this.state.open; document.body.style.overflow = open ? 'hidden' : ''; this.setState({ open }); },
      close: this.close,
    };
  }
}
</script>
</body>
</html>
